name: Native fuzzer tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          python3 --version
          clang --version
      - name: Synthetic acceptance tests
        run: python3 -m unittest discover -v -p 'test_*.py'
